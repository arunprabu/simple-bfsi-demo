name: Backend CI/CD

# build -> test -> scan -> push to ECR -> deploy to ECS Fargate -> smoke test
# Pull requests stop after the scan; only pushes to main (or a manual run on main) deploy.

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci-cd.yml
      - .github/scripts/smoke-test.sh
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-ci-cd.yml
      - .github/scripts/smoke-test.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: itc/fast-api-demo
  ECS_CLUSTER: simple-bank-cluster
  ECS_SERVICE: simple-bank-backend-svc
  ECS_TASK_FAMILY: simple-bank-backend
  ECS_CONTAINER_NAME: backend
  LOCAL_IMAGE: simple-bank-backend:${{ github.sha }}
  IMAGE_TAG: backend-${{ github.sha }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/backend-image.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # The same tarball is scanned and then pushed, so what ships is what was scanned.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15.6-alpine
        env:
          # Throwaway CI database that is only reachable from this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: simple_bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simple_bank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/simple_bank_test
      # Some integration tests resolve the database and demo-auth settings from the environment.
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/simple_bank_test
      APP_ENV: test
      FAKE_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.27"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit, contract and integration tests
        run: uv run --locked pytest -m "not performance"

      # Skips itself unless the runner is Linux x86_64 with at least 2 vCPU and 4 GiB RAM.
      - name: Transfer latency acceptance test
        run: uv run --locked pytest -m performance

  scan:
    name: Scan image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - name: Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/backend-image.tar
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  push:
    name: Push image to ECR
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: image
        name: Load, tag and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker load --input "$RUNNER_TEMP/backend-image.tar"
          image_uri="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker tag "$LOCAL_IMAGE" "${REGISTRY}/${ECR_REPOSITORY}:backend-latest"
          docker push "$image_uri"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:backend-latest"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS Fargate
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # The task definition registered in ECS stays the source of truth; only the image changes.
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.ECS_TASK_FAMILY }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ needs.push.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  smoke-test:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Run smoke test against the deployed service
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          : "${BASE_URL:?Set the SMOKE_TEST_BASE_URL repository variable to the load balancer URL}"
          bash .github/scripts/smoke-test.sh "$BASE_URL"
